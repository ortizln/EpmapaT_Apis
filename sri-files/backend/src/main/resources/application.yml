server:
  port: ${SERVER_PORT:9090}

spring:
  application:
    name: msvc-sri
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:${DB_URL:}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASS:}}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    locations: classpath:db/migration

debug: false
xml:
  storage:
    path: /path/to/your/xml/storage
app:
  reports:
    path: /home/epmapaadmin/reportsEpmapat
  backend:
    base-url: ${ERP_BACKEND_BASE_URL:http://192.168.0.165:9080}
  email-ms:
    base-url: ${EMAIL_MS_BASE_URL:http://localhost:9099}
  mail:
    from: facturacion@epmapatulcan.gob.ec
    username: facturacion
    display-name: EPMAPA-T
    reply-to: facturacion@epmapatulcan.gob.ec
interes:
  tarea:
    cron: 0 */1 * * * *
sri:
  legacy-scheduler:
    enabled: ${SRI_LEGACY_SCHEDULER_ENABLED:false}
  scheduler:
    envio-facturas:
      cron: ${SRI_SCHEDULER_ENVIO_FACTURAS_CRON:0 */1 * * * *}
    recuperacion-xml:
      cron: ${SRI_SCHEDULER_RECUPERACION_XML_CRON:30 */3 * * * *}
  ambiente: 2
  polling:
    attempts: 40
    initialSleepMs: 2000
    maxSleepMs: 8000
    backoffFactor: 1.5
    stopOnNoAutorizado: true
  wsdl:
    local:
      recepcion: wsdl/RecepcionComprobantesOffline.wsdl
      autorizacion: wsdl/AutorizacionComprobantesOffline.wsdl
  endpoint:
    recepcion:
      pruebas: https://celcer.sri.gob.ec/comprobantes-electronicos-ws/RecepcionComprobantesOffline
      produccion: https://cel.sri.gob.ec/comprobantes-electronicos-ws/RecepcionComprobantesOffline
    autorizacion:
      pruebas: https://celcer.sri.gob.ec/comprobantes-electronicos-ws/AutorizacionComprobantesOffline
      produccion: https://cel.sri.gob.ec/comprobantes-electronicos-ws/AutorizacionComprobantesOffline

net:
  sf:
    jasperreports:
      awt:
        ignore:
          missing:
            font=true:

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

sri-files:
  auth:
    secret: ${SRI_FILES_AUTH_SECRET:sri-files-dev-secret}
    expiration-seconds: ${SRI_FILES_AUTH_EXPIRATION_SECONDS:28800}
  processing:
    batch-size: ${SRI_FILES_PROCESSING_BATCH_SIZE:20}
    max-retries: ${SRI_FILES_PROCESSING_MAX_RETRIES:5}
    recibidos-cron: ${SRI_FILES_PROCESSING_RECIBIDOS_CRON:0 */1 * * * *}
  storage:
    root: ${SRI_FILES_STORAGE_ROOT:data/sri-files}
  sri:
    default-environment: ${SRI_FILES_SRI_DEFAULT_ENVIRONMENT:1}
