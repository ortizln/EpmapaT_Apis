spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:${DB_URL:}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASS:}}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${SPRING_MAIL_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT:5000}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:9090}

app:
  reports:
    path: ${APP_REPORTS_PATH:/home/epmapaadmin/reportsEpmapat}
  mail:
    from: ${APP_MAIL_FROM:facturacion@epmapatulcan.gob.ec}
    username: ${APP_MAIL_USERNAME:facturacion}
    display-name: ${APP_MAIL_DISPLAY_NAME:EPMAPA-T}
    reply-to: ${APP_MAIL_REPLY_TO:facturacion@epmapatulcan.gob.ec}

sri:
  ambiente: ${SRI_AMBIENTE:2}
  scheduler:
    envio-facturas:
      cron: ${SRI_SCHEDULER_ENVIO_FACTURAS_CRON:0 */1 * * * *}
    recuperacion-xml:
      cron: ${SRI_SCHEDULER_RECUPERACION_XML_CRON:30 */3 * * * *}

logging:
  level:
    root: INFO
    com.erp.sri_files: INFO
    org.springframework.jdbc: INFO
    com.zaxxer.hikari: INFO

sri-files:
  processing:
    batch-size: ${SRI_FILES_PROCESSING_BATCH_SIZE:20}
    max-retries: ${SRI_FILES_PROCESSING_MAX_RETRIES:5}
    recibidos-cron: ${SRI_FILES_PROCESSING_RECIBIDOS_CRON:0 */1 * * * *}
  storage:
    root: ${SRI_FILES_STORAGE_ROOT:/data/sri-files}
  sri:
    default-environment: ${SRI_FILES_SRI_DEFAULT_ENVIRONMENT:2}
