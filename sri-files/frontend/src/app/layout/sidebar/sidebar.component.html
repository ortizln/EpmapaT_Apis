<aside
  class="sidebar"
  [class.sidebar--collapsed]="ui.sidebarCollapsed()"
  [class.sidebar--mobile-open]="ui.mobileSidebarOpen()"
>
  <div class="brand">
    <span class="brand__eyebrow">SRI Files</span>
    <h1>{{ ui.sidebarCollapsed() ? 'SRI' : 'Administracion documental' }}</h1>
    <p *ngIf="!ui.sidebarCollapsed()">Panel operativo para facturacion electronica y gestion de comprobantes.</p>
  </div>

  <nav class="menu">
    <section
      class="menu__group"
      *ngFor="let group of visibleGroups(); trackBy: trackByGroup"
      [class.menu__group--expanded]="isGroupExpanded(group.id)"
      [class.menu__group--active]="isGroupActive(group)"
    >
      <button
        *ngIf="!ui.sidebarCollapsed()"
        type="button"
        class="menu__toggle"
        [class.menu__toggle--active]="isGroupActive(group)"
        (click)="toggleGroup(group.id)"
      >
        <span class="menu__heading">{{ group.heading }}</span>
        <span class="menu__chevron" [class.menu__chevron--expanded]="isGroupExpanded(group.id)">⌄</span>
      </button>

      <div class="menu__items" [class.menu__items--collapsed]="!isGroupExpanded(group.id)">
        <a
          *ngFor="let item of group.items; trackBy: trackByItem"
          [routerLink]="item.route"
          routerLinkActive="active"
          [attr.title]="ui.sidebarCollapsed() ? item.title : null"
          (click)="ui.closeMobileSidebar()"
        >
          <span class="menu__icon">{{ item.icon }}</span>
          <span class="menu__label" *ngIf="!ui.sidebarCollapsed()">{{ item.label }}</span>
        </a>
      </div>
    </section>
  </nav>

  <div class="sidebar__footer" *ngIf="!ui.sidebarCollapsed()">
    <strong>{{ authStore.usuario()?.nombre || 'Sin sesion' }}</strong>
    <span>{{ authStore.usuario()?.roles?.join(', ') || 'Operador' }}</span>
  </div>
</aside>
