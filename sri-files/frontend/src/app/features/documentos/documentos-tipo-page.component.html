<app-page-header
  eyebrow="Operacion"
  [title]="title()"
  [description]="description()"
  badge="Bandeja especializada"
>
  <ng-container *ngIf="newRoute()">
    <button *appHasPermission="'DOCUMENTO_CREAR'" type="button" (click)="irANuevoRegistro()">{{ newLabel() }}</button>
  </ng-container>
  <button type="button" class="secondary-button" routerLink="/documentos">Ver bandeja general</button>
</app-page-header>

<app-documentos-recientes-table
  [documentos]="documentos"
  [tiposDocumento]="tiposDocumentoVisibles()"
  [tipoDocumento]="tipoDocumento()"
  [estado]="filtroEstado"
  [busqueda]="filtroBusqueda"
  [page]="page"
  [size]="size"
  [totalPages]="totalPages"
  [totalItems]="totalItems"
  [loading]="loading"
  [error]="error"
  (tipoDocumentoChange)="noop()"
  (estadoChange)="onEstadoChange($event)"
  (busquedaChange)="onBusquedaChange($event)"
  (pageChange)="onPageChange($event)"
  (sizeChange)="onSizeChange($event)"
  (verDetalle)="irADetalle($event)"
  (cargarXmlRapido)="cargarXmlRapido($event)"
/>
