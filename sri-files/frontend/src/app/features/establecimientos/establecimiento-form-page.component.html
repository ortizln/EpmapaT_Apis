<app-page-header
  eyebrow="Configuracion"
  [title]="editingId ? 'Editar establecimiento' : 'Nuevo establecimiento'"
  description="Formulario dedicado para asociar establecimientos a una empresa emisora."
  badge="Solo ADMIN"
>
  <button type="button" class="secondary-button" (click)="volver()">Volver a catalogos</button>
</app-page-header>

<section class="workspace">
  <article class="panel">
    <div class="panel__header">
      <div>
        <h3>{{ editingId ? 'Datos del establecimiento' : 'Registro de nuevo establecimiento' }}</h3>
        <p>Selecciona la empresa emisora y completa la informacion operativa de la sede.</p>
      </div>
    </div>

    <form class="establishment-form" [formGroup]="form" (ngSubmit)="guardar()">
      <label><span class="form-label">Empresa</span><select formControlName="empresaId"><option value="">Selecciona una empresa</option><option *ngFor="let empresa of empresas" [value]="empresa.id">{{ empresa.razonSocial }}</option></select></label>
      <label><span class="form-label">Codigo</span><input type="text" formControlName="codigo" maxlength="3" /></label>
      <label><span class="form-label">Nombre</span><input type="text" formControlName="nombre" /></label>
      <label><span class="form-label">Direccion</span><input type="text" formControlName="direccion" /></label>

      <p class="feedback feedback--error" *ngIf="formError">{{ formError }}</p>

      <div class="actions">
        <button type="submit" class="primary-button" [disabled]="saving">
          {{ saving ? 'Guardando...' : editingId ? 'Actualizar establecimiento' : 'Crear establecimiento' }}
        </button>
        <button type="button" class="ghost-button" (click)="volver()" [disabled]="saving">Cancelar</button>
      </div>
    </form>
  </article>
</section>
